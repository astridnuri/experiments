<!DOCTYPE html>
<html>
    <head>
        <title>Ruleset Style</title>
        <style>
            h1,h2,h3,h4 {
                /* background-color: rgb(137, 249, 117); */
                color: rgb(48, 53, 206)
            }
            .important {
                color: rgb(186, 1, 1);
                font-size: 30px;
            }
            .kapital {
                text-transform: uppercase;
            }
            #the-one {
                color: rgb(252, 83, 204);
            }
            #mrJones {
                background-color: rgb(35, 2, 25) !important;
            }
        </style>
            
    </head>
    <body>
        <h1>Heading <span id="the-one">One</span></h1>
        <h2 class="important">Heading 2</h2>
        <h3>Heading 3</h3>
        <h4 class="important kapital">Heading 4</h4>
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3 class="important kapital">Heading 3</h3>
        <h4 id="mrJones" style="background-color: aquamarine;">Heading 4</h4>
    </body>
</html>
