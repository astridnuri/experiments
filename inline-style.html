<!DOCTYPE html>
<html>
    <head>
        <title>Inline Style</title>
    </head>
    <body>
        <h1 style="font-size: 30px; color:darkblue; background-color: rgb(137, 249, 117)">Heading <span style="color: crimson; background-color: rgb(236, 216, 33)">One</span></h1>
        <h2 style="font-size: 25px; color:darkgreen;">Heading 2</h2>
        <h3 style="font-size: 20px; color:darkred;">Heading 3</h3>
        <h4 style="font-size: 16px; color:darkorange;">Heading 4</h4>
        <h1 style="font-size: 30px; color: rgb(186, 13, 186);">Heading 1</h1>
        <h2 style="font-size: 25px; color:rgb(12, 185, 12);">Heading 2</h2>
        <h3 style="font-size: 20px; color:rgb(186, 8, 8);">Heading 3</h3>
        <h4 style="font-size: 16px; color:rgb(188, 94, 17);">Heading 4</h4>
    </body>
</html>
